---
layout: default
---

<div class="background-video-wrapper">
  <video class="background-video" muted autoplay loop playsinline preload="auto">
    <source src="{{ site.baseurl }}{{ page.video_path }}.mp4" type="video/mp4">
    <source src="{{ site.baseurl }}{{ page.video_path }}.webm" type="video/webm">
  </video>
</div>

<div class="initial-content">
  <div id="main" role="main">
    {% include sidebar.html %}
    <article class="page" itemscope itemtype="https://schema.org/CreativeWork">
      <div class="page__inner-wrap">
        <header>
          <h1 class="page__title" itemprop="headline">{{ page.project_title }}</h1>
        </header>
        <section class="page__content" itemprop="text">
          {{ content }}
        </section>
        <footer class="page__meta"></footer>
      </div>
    </article>
  </div>
</div>
