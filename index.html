---
layout: default
title: "Projects"
permalink: /
---

<div class="project-container">
    {% for design in site.data.projects %}
    {% assign link = design.url %}
    
    <a href="{% if link contains 'http' %}{{ link }}{% else %}{{ site.baseurl }}{{ link }}{% endif %}" 
       {% if link contains 'http' %}target="_blank"{% endif %}
       class="project-card">

        <div class="project-item">
            <img src="{{ site.baseurl }}{{ design.main_image }}" alt="{{ design.name }}">
            <div class="project-overlay">
                <div class="overlay-content">
                    <h2>{{ design.name }}</h2>
                </div>
            </div>
        </div>
    </a>
    {% endfor %}
</div>

<style>
    /* 1. Spacing from the Masthead */
    .wrapper {
        display: flex;
        justify-content: center;
        min-height: 100vh;
        padding-top: 3rem; 
    }

    .project-container {
        display: grid;
        /* Default to 3 columns for desktop */
        grid-template-columns: repeat(3, 1fr); 
        gap: 0.5rem;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        margin-top: 0.5rem; 
        margin-bottom: 0.5rem;
        padding: 0 10px; /* Added side padding for mobile screens */
    }

    .project-card {
        text-decoration: none;
        display: block;
        width: 100%; /* Ensure card takes full width of grid cell */
    }

    .project-item {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        /* This is key: it keeps it a square regardless of width */
        aspect-ratio: 1 / 1; 
        width: 100%;
        background-color: #f0f0f0;
    }

    .project-item img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Ensures image fills the square without stretching */
        display: block;
        transition: transform 0.5s ease; 
    }

    .project-item:hover img {
        transform: scale(1.08);
    }

    /* 3. Overlay Styling */
    .project-overlay {
        position: absolute;
        inset: 0; /* Shortcut for top/left/right/bottom: 0 */
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease;
        padding: 1rem;
        z-index: 1;
    }

    .project-item:hover .project-overlay {
        opacity: 1;
    }

    .project-overlay h2 {
        color: white !important; /* Ensure theme doesn't override color */
        margin: 0;
        font-weight: 350;
        font-size: 1.1rem; /* Slightly smaller for mobile compatibility */
        text-align: center;
        line-height: 1.2;
        font-family: 'Outfit', sans-serif; /* Using your new font! */
    }

    /* 4. Mobile Responsiveness */
    @media (max-width: 768px) {
        .wrapper {
            padding-top: 2rem;
        }
        .project-container {
            /* Switch to 2 columns for tablets/large phones */
            grid-template-columns: repeat(2, 1fr);
            gap: 0.4rem;
        }
        .project-overlay h2 {
            font-size: 0.9rem; /* Make text smaller so it fits on mobile squares */
        }
    }

    @media (max-width: 480px) {
        .project-container {
            /* Keep it at 2 columns but you could switch to 1 if you prefer large images */
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>
